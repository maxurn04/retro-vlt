spring.application.name=contact-service
server.port=8085

# Excluir configuraciones de BD ya que contact-service opera de manera stateless
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

springdoc.group-configs[0].group=contacto
springdoc.group-configs[0].display-name=Contacto
springdoc.group-configs[0].paths-to-match=/api/contacto/**
