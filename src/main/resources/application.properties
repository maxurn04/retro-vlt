spring.application.name=retro-vlt
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/tienda_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

springdoc.group-configs[0].group=tienda
springdoc.group-configs[0].display-name=1. Tienda (Clientes y Publico)
springdoc.group-configs[0].paths-to-match=/api/productos/**,/api/categorias/**,/api/checkout/**,/api/auth/**,/api/blogs/**

springdoc.group-configs[1].group=admin
springdoc.group-configs[1].display-name=2. Administracion (Backoffice)
springdoc.group-configs[1].paths-to-match=/api/admin/**

springdoc.group-configs[2].group=todos
springdoc.group-configs[2].display-name=3. API Completa (Todos los Endpoints)
springdoc.group-configs[2].paths-to-match=/api/**
