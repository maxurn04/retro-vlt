spring.application.name=catalog-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/tienda_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

springdoc.group-configs[0].group=catalogo
springdoc.group-configs[0].display-name=1. Catálogo de Productos y Categorías
springdoc.group-configs[0].paths-to-match=/api/productos/**,/api/categorias/**
